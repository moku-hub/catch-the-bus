<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バス送信端末</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f5f7fa;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --text:#1a1e2e;--text-muted:#5a6478;
  --accent:#1a5fb4;--accent-bg:#e6f1fb;
  --green:#16a34a;--green-bg:#dcfce7;
  --amber:#b45309;--amber-bg:#fef3c7;
  --red:#dc2626;--red-bg:#fee2e2;
  --radius:14px;
}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}
header{color:#fff;padding:14px 20px 10px;display:flex;align-items:center;gap:12px}
.logo-box{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.header-text h1{font-size:16px;font-weight:600}
.header-text p{font-size:12px;opacity:0.8;margin-top:1px}
.header-spacer{flex:1}
.tx-indicator{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.3);transition:background 0.2s}
.tx-indicator.active{background:#34d399;box-shadow:0 0 8px #34d399}
main{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;max-width:500px;margin:0 auto;width:100%}
.card{background:var(--surface);border-radius:var(--radius);border:0.5px solid var(--border);padding:16px 18px}
.card-label{font-size:11px;color:var(--text-muted);font-weight:500;
  text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.form-group label{font-size:12px;color:var(--text-muted);font-weight:500}
.form-group input,.form-group select{padding:10px 12px;border:0.5px solid var(--border2);
  border-radius:8px;font-size:15px;background:var(--surface2);color:var(--text);
  outline:none;font-family:inherit}
.route-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-radius:8px;font-size:13px;font-weight:500;margin-top:4px}
.gps-status{display:flex;align-items:center;gap:14px;padding:8px 0}
.gps-circle{width:52px;height:52px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:var(--surface2);border:2px solid var(--border);transition:all 0.3s}
.gps-circle.acquiring{border-color:var(--amber);background:var(--amber-bg);animation:pulse 1.5s infinite}
.gps-circle.locked{border-color:var(--green);background:var(--green-bg)}
.gps-circle.error{border-color:var(--red);background:var(--red-bg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.gps-info{flex:1}
.gps-state{font-size:14px;font-weight:600;margin-bottom:3px}
.gps-detail{font-size:11px;color:var(--text-muted);line-height:1.6}
.speed-display{text-align:center;padding:4px 0}
.speed-big{font-size:56px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.speed-unit{font-size:15px;color:var(--text-muted);margin-left:4px}
.speed-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
#mini-map{height:160px;border-radius:10px;overflow:hidden;border:0.5px solid var(--border)}
.op-btns{display:flex;gap:10px}
.op-btn{flex:1;padding:16px;border-radius:var(--radius);font-size:16px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:all 0.2s;border:none;
  display:flex;align-items:center;justify-content:center;gap:8px}
.op-btn.start{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(26,95,180,0.35)}
.op-btn.start:active{transform:scale(0.97)}
.op-btn.stop{background:var(--red-bg);color:var(--red);border:0.5px solid rgba(220,38,38,0.3)}
.op-btn.stop:active{transform:scale(0.97)}
.op-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none !important}
.status-bar{border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:8px;transition:all 0.3s}
.status-bar.idle{background:var(--surface2);color:var(--text-muted);border:0.5px solid var(--border)}
.status-bar.running{background:var(--green-bg);color:var(--green);border:0.5px solid rgba(22,163,74,0.3)}
.status-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.status-dot.pulse{animation:pulse 1.2s infinite}
.pass-item{display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:0.5px solid var(--border);font-size:13px}
.pass-item:last-child{border:none}
.pass-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pass-name{flex:1}
.pass-time{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.log-area{max-height:100px;overflow-y:auto;font-size:11px;
  font-family:'SF Mono','Fira Code',monospace;line-height:1.7;color:var(--text-muted)}
.log-entry.ok{color:var(--green)}
.log-entry.warn{color:var(--amber)}
.log-entry.err{color:var(--red)}
/* チェックリスト */
.stop-check-item{display:flex;align-items:center;gap:10px;padding:8px 4px;
  border-bottom:0.5px solid var(--border);transition:all 0.3s}
.stop-check-item:last-child{border:none}
.stop-check-item.passed{opacity:0.5}
.check-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  flex-shrink:0;transition:all 0.3s;background:var(--surface2)}
.check-circle.checked{background:var(--green);border-color:var(--green);color:#fff}
.check-circle.near{background:var(--amber-bg);border-color:var(--amber);animation:pulse 1s infinite}
.stop-check-name{flex:1;font-size:13px;font-weight:500}
.stop-check-time{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.stop-check-dist{font-size:11px;color:var(--amber);font-weight:500}
</style>
</head>
<body>
<style>
#password-screen{position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;
  justify-content:center;z-index:99999;flex-direction:column;gap:16px}
#password-screen.hidden{display:none}
.pw-card{background:#16213e;border:0.5px solid #0f3460;border-radius:16px;padding:32px 28px;
  width:280px;text-align:center}
.pw-logo{font-size:48px;margin-bottom:8px}
.pw-title{color:#e2e8f0;font-size:18px;font-weight:600;margin-bottom:4px}
.pw-sub{color:#94a3b8;font-size:13px;margin-bottom:20px}
.pw-input{width:100%;padding:12px;border-radius:10px;border:1px solid #0f3460;
  background:#0f3460;color:#e2e8f0;font-size:18px;text-align:center;letter-spacing:4px;
  outline:none;box-sizing:border-box}
.pw-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#4f9cf9;
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.pw-error{color:#f87171;font-size:12px;margin-top:8px;display:none}
</style>
<div id="password-screen">
  <div class="pw-card">
    <div class="pw-logo">🚌</div>
    <div class="pw-title">Catch the Bus</div>
    <div class="pw-sub">パスワードを入力してください</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="●●●●" maxlength="20">
    <button class="pw-btn" onclick="checkPassword()">ログイン</button>
    <div class="pw-error" id="pw-error">パスワードが違います</div>
  </div>
</div>
<script>
function checkPassword() {
  var input = document.getElementById('pw-input').value;
  if (input === '1749') {
    document.getElementById('password-screen').classList.add('hidden');
    sessionStorage.setItem('ctb_auth', '1');
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
document.getElementById('pw-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});
if (sessionStorage.getItem('ctb_auth') === '1') {
  document.getElementById('password-screen').classList.add('hidden');
}
</script>

<header id="header" style="background:#1a5fb4">
  <div class="logo-box">🚌</div>
  <div class="header-text">
    <h1>バス送信端末</h1>
    <p id="header-sub">設定してください</p>
  </div>
  <div class="header-spacer"></div>
  <div class="tx-indicator" id="tx-dot"></div>
</header>

<main>
  <div class="card">
    <div class="card-label">バス設定</div>
    <div class="form-group">
      <label>バス名称</label>
      <input id="bus-name" value="黄バス" placeholder="1号車">
    </div>
    <div class="form-group">
      <label>担当ルート</label>
      <select id="bus-route-sel">
        <option value="1">ルート1（青）</option>
        <option value="2" selected>ルート2（オレンジ）</option>
      </select>
    </div>
    <div class="route-preview" id="route-preview" style="background:#fff0e6;color:#c2410c">
      🟡 ルート2（オレンジ）が選択されています
    </div>
    <div class="form-group" style="margin-top:8px">
      <label>送信間隔</label>
      <select id="interval">
        <option value="3000">3秒ごと（推奨）</option>
        <option value="5000">5秒ごと</option>
        <option value="10000">10秒ごと</option>
      </select>
    </div>
  </div>

  <div class="status-bar idle" id="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">運行待機中</span>
    <span style="flex:1"></span>
    <span id="elapsed-time" style="font-variant-numeric:tabular-nums"></span>
  </div>

  <div class="op-btns">
    <button class="op-btn start" id="start-btn">▶️ 運行開始</button>
    <button class="op-btn stop" id="stop-btn" disabled>⏹ 運行終了</button>
  </div>

  <div class="card">
    <div class="card-label">GPS状態</div>
    <div class="gps-status">
      <div class="gps-circle" id="gps-circle">📡</div>
      <div class="gps-info">
        <div class="gps-state" id="gps-state">待機中</div>
        <div class="gps-detail" id="gps-detail">運行開始でGPSを有効化します</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">現在の速度</div>
    <div class="speed-display">
      <span class="speed-big" id="speed-val" style="color:var(--accent)">0</span>
      <span class="speed-unit">km/h</span>
      <div class="speed-sub" id="heading-val">方位: ―</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">現在地</div>
    <div id="mini-map"></div>
  </div>

  <div class="card">
    <div class="card-label" style="display:flex;align-items:center;justify-content:space-between">
      <span>🚏 バス停チェックリスト</span>
      <span id="stop-progress" style="font-size:11px;color:var(--text-muted)"></span>
    </div>
    <div id="stop-checklist">
      <div style="font-size:12px;color:var(--text-muted)">ルートを選択すると表示されます</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">送信ログ</div>
    <div class="log-area" id="log-area">
      <div class="log-entry">システム準備完了</div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.js"></script>
<!-- Firebase SDK (CDN, no module) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAQ233V2MARq5kweD0tL0cIPQA7ffkCxuo",
  authDomain: "catch-the-bus-7de42.firebaseapp.com",
  databaseURL: "https://catch-the-bus-7de42-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "catch-the-bus-7de42",
  storageBucket: "catch-the-bus-7de42.firebasestorage.app",
  messagingSenderId: "770999214364",
  appId: "1:770999214364:web:0e58445b69b14b3facdad9"
});
const db = firebase.database();

let busId = localStorage.getItem('bus_fixed_id');
if (!busId) { busId = 'bus_' + Math.random().toString(36).slice(2,8); localStorage.setItem('bus_fixed_id', busId); }

let operating = false;
let watchId = null;
let sendInterval = null;
let elapsedInterval = null;
let currentPos = null;
let miniMap = null;
let selfMarker = null;
let lastLat = null, lastLng = null, lastTime = null;
let startTime = null;
let passedStops = [];
let notifiedStops = new Set();
const SESSION_KEY = 'ctb_session_' + busId;

let stops = { '1': [], '2': [] };
let routeNames = { '1': 'ルート1', '2': 'ルート2' };

// Firebaseからバス停・ルート名を読み込み
db.ref('config/stops').on('value', function(snap) {
  var data = snap.val();
  if (data) {
    stops['1'] = data['1'] ? Object.values(data['1']) : [];
    stops['2'] = data['2'] ? Object.values(data['2']) : [];
  } else {
    stops['1'] = []; stops['2'] = [];
  }
  renderStopChecklist();
});
db.ref('config/routeNames').on('value', function(snap) {
  var data = snap.val();
  if (data) {
    routeNames = data;
    updateRouteSelect();
    onRouteChange();
  }
});
const ROUTE_COLOR = { '1': '#1a5fb4', '2': '#f97316' };
const ROUTE_BG = { '1': '#e6f1fb', '2': '#fff0e6' };
const ROUTE_ICON = { '1': '🔵', '2': '🟡' };
const HEADER_COLOR = { '1': '#1a5fb4', '2': '#c2410c' };

// ルート選択更新
function updateRouteSelect() {
  const sel = document.getElementById('bus-route-sel');
  sel.options[0].text = routeNames['1'] + '（青）';
  sel.options[1].text = routeNames['2'] + '（黄）';
}

function onRouteChange() {
  const r = document.getElementById('bus-route-sel').value;
  const preview = document.getElementById('route-preview');
  preview.style.background = ROUTE_BG[r];
  preview.style.color = ROUTE_COLOR[r];
  preview.textContent = ROUTE_ICON[r] + ' ' + routeNames[r] + ' が選択されています';
  document.getElementById('header').style.background = HEADER_COLOR[r];
  renderStopChecklist();
}

document.getElementById('bus-route-sel').addEventListener('change', onRouteChange);

// 運行開始
document.getElementById('start-btn').addEventListener('click', function() {
  if (!navigator.geolocation) { addLog('GPSが使えません', 'err'); return; }
  operating = true;
  startTime = Date.now();
  passedStops = [];
  notifiedStops.clear();
  db.ref('bus_checklist/' + busId).remove();
  saveSession();
  renderStopChecklist();

  document.getElementById('start-btn').disabled = true;
  document.getElementById('stop-btn').disabled = false;
  document.getElementById('bus-name').disabled = true;
  document.getElementById('bus-route-sel').disabled = true;

  const r = document.getElementById('bus-route-sel').value;
  const name = document.getElementById('bus-name').value;
  document.getElementById('header-sub').textContent = name + '　' + routeNames[r] + '　運行中';
  setStatusBar(true);
  setGpsState('acquiring', '位置情報を取得中…', '精度が上がるまでお待ちください');

  watchId = navigator.geolocation.watchPosition(onPosition, onGpsError,
    {enableHighAccuracy: true, maximumAge: 1000, timeout: 15000});
  const interval = parseInt(document.getElementById('interval').value);
  sendInterval = setInterval(doSend, interval);
  elapsedInterval = setInterval(updateElapsed, 1000);
  addLog('運行開始 → ' + name + ' / ' + routeNames[r], 'ok');
});

// 運行終了
document.getElementById('stop-btn').addEventListener('click', function() {
  if (!confirm('運行を終了しますか？')) return;
  operating = false;
  if (watchId) navigator.geolocation.clearWatch(watchId);
  if (sendInterval) clearInterval(sendInterval);
  if (elapsedInterval) clearInterval(elapsedInterval);

  db.ref('buses/' + busId).remove();
  db.ref('bus_checklist/' + busId).remove();
  clearSession();
  passedStops = [];
  notifiedStops.clear();

  document.getElementById('start-btn').disabled = false;
  document.getElementById('stop-btn').disabled = true;
  document.getElementById('bus-name').disabled = false;
  document.getElementById('bus-route-sel').disabled = false;
  document.getElementById('tx-dot').classList.remove('active');
  document.getElementById('header-sub').textContent = '運行終了';
  document.getElementById('elapsed-time').textContent = '';
  setStatusBar(false);
  setGpsState('', '待機中', '次の運行開始までお待ちください');
  renderStopChecklist();
  addLog('運行終了', 'warn');
});

function onPosition(pos) {
  const {latitude:lat, longitude:lng, accuracy, speed, heading} = pos.coords;
  currentPos = {lat, lng, accuracy, speed, heading};
  let kmh = 0;
  if (speed !== null && speed >= 0) { kmh = speed * 3.6; }
  else if (lastLat !== null) {
    const dt = (Date.now() - lastTime) / 1000;
    const dist = haversine(lastLat, lastLng, lat, lng);
    kmh = dt > 0 ? (dist / dt) * 3.6 : 0;
  }
  lastLat = lat; lastLng = lng; lastTime = Date.now();
  document.getElementById('speed-val').textContent = Math.round(kmh);
  document.getElementById('heading-val').textContent = '方位: ' + (heading !== null ? degToCompass(heading) + '(' + Math.round(heading) + '°)' : '取得中');
  setGpsState('locked', 'GPS取得完了', '精度:±' + Math.round(accuracy) + 'm　' + lat.toFixed(5) + ',' + lng.toFixed(5));
  if (miniMap) {
    miniMap.setView([lat, lng], 15);
    if (!selfMarker) {
      selfMarker = L.circleMarker([lat,lng], {radius:10, color:'#1a5fb4', fillColor:'#4f9cf9', fillOpacity:0.9, weight:2}).addTo(miniMap);
    } else { selfMarker.setLatLng([lat, lng]); }
  }
  if (operating) checkNearbyStops(lat, lng);
}

function checkNearbyStops(lat, lng) {
  const r = document.getElementById('bus-route-sel').value;
  const list = stops[r] || [];
  // 次にチェックすべきバス停index（まだ通過していない最初のもの）
  var nextIndex = 0;
  while (nextIndex < list.length && notifiedStops.has(r + '_' + nextIndex)) {
    nextIndex++;
  }
  if (nextIndex >= list.length) return; // 全停留所通過済み
  const s = list[nextIndex];
  const dist = haversine(lat, lng, s.lat, s.lng);
  const key = r + '_' + nextIndex;
  if (dist < 50) {
    notifiedStops.add(key);
    const now = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    passedStops.push({name: s.name, time: now, route: r});
    renderStopChecklist();
    sendPassRecord(s.name, now);
    notifyStop(s.name, dist);
    saveSession();
  }
}

function notifyStop(name, dist) {
  addLog('🚏 ' + name + ' に接近（' + Math.round(dist) + 'm）', 'ok');
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
  if (Notification.permission === 'granted') {
    new Notification('🚏 バス停に接近', {body: name + ' まで約' + Math.round(dist) + 'm'});
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(function(p) {
      if (p === 'granted') new Notification('🚏 バス停に接近', {body: name});
    });
  }
}

function sendPassRecord(name, time) {
  db.ref('pass_records/' + busId + '/' + Date.now()).set({
    busName: document.getElementById('bus-name').value,
    stopName: name,
    time: time,
    route: document.getElementById('bus-route-sel').value,
    timestamp: Date.now()
  });
}

function renderStopChecklist() {
  const r = document.getElementById('bus-route-sel').value;
  const list = stops[r] || [];
  const el = document.getElementById('stop-checklist');
  const prog = document.getElementById('stop-progress');
  if (!list.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">バス停が登録されていません</div>';
    prog.textContent = '';
    return;
  }
  const checked = passedStops.length;
  prog.textContent = checked + ' / ' + list.length + ' 通過';
  const color = ROUTE_COLOR[r];
  el.innerHTML = list.map(function(s, i) {
    const key = r + '_' + i;
    const passed = notifiedStops.has(key);
    const p = passedStops.find(function(x) { return x.name === s.name; });
    return '<div class="stop-check-item' + (passed ? ' passed' : '') + '" id="check-item-' + i + '">' +
      '<div class="check-circle' + (passed ? ' checked' : '') + '" style="' + (!passed ? 'border-color:' + color : '') + '">' +
      (passed ? '✓' : (i + 1)) + '</div>' +
      '<div style="flex:1">' +
        '<div class="stop-check-name" style="' + (passed ? 'text-decoration:line-through' : '') + '">' + s.name + '</div>' +
        (s.time ? '<div style="font-size:11px;color:var(--text-muted)">予定 ' + s.time + '</div>' : '') +
      '</div>' +
      (passed && p ? '<span class="stop-check-time">' + p.time + '</span>' : '<span class="stop-check-dist" id="dist-' + i + '"></span>') +
      '</div>';
  }).join('');
}

function doSend() {
  if (!currentPos || !operating) return;
  const lat = currentPos.lat, lng = currentPos.lng;
  const speed = currentPos.speed, heading = currentPos.heading;
  const kmh = speed !== null && speed >= 0 ? speed * 3.6 : parseFloat(document.getElementById('speed-val').textContent) || 0;
  const r = document.getElementById('bus-route-sel').value;
  db.ref('buses/' + busId).set({
    busName: document.getElementById('bus-name').value,
    route: routeNames[r],
    routeId: r,
    lat: lat, lng: lng,
    speed: kmh,
    heading: heading || 0,
    status: kmh > 2 ? 'running' : 'stopped',
    operating: true,
    color: '#fbbf24',
    timestamp: Date.now()
  }).then(function() {
    var dot = document.getElementById('tx-dot');
    dot.classList.add('active');
    setTimeout(function() { dot.classList.remove('active'); }, 400);
    addLog('送信 ' + lat.toFixed(5) + ',' + lng.toFixed(5) + ' ' + Math.round(kmh) + 'km/h', 'ok');
  }).catch(function(e) { addLog('送信エラー: ' + e.message, 'err'); });
}

function setStatusBar(running) {
  var bar = document.getElementById('status-bar');
  var dot = document.getElementById('status-dot');
  var txt = document.getElementById('status-text');
  if (running) {
    bar.className = 'status-bar running';
    dot.className = 'status-dot pulse';
    txt.textContent = '運行中';
  } else {
    bar.className = 'status-bar idle';
    dot.className = 'status-dot';
    txt.textContent = '運行待機中';
  }
}

function updateElapsed() {
  if (!startTime) return;
  var s = Math.floor((Date.now() - startTime) / 1000);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  document.getElementById('elapsed-time').textContent =
    (h > 0 ? h + '時間' : '') + m + '分' + String(sec).padStart(2, '0') + '秒';
}

function onGpsError(err) {
  var msgs = {1:'位置情報の許可が必要です', 2:'位置情報を取得できません', 3:'タイムアウト'};
  setGpsState('error', 'GPSエラー', msgs[err.code] || err.message);
  addLog('GPSエラー: ' + (msgs[err.code] || err.message), 'err');
}

function setGpsState(cls, state, detail) {
  var c = document.getElementById('gps-circle');
  c.className = 'gps-circle ' + cls;
  c.textContent = cls==='locked' ? '✅' : cls==='acquiring' ? '📡' : cls==='error' ? '❌' : '📡';
  document.getElementById('gps-state').textContent = state;
  document.getElementById('gps-detail').textContent = detail;
}

function addLog(msg, type) {
  var el = document.getElementById('log-area');
  var t = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  var div = document.createElement('div');
  div.className = 'log-entry ' + (type || '');
  div.textContent = '[' + t + '] ' + msg;
  el.prepend(div);
  while (el.children.length > 30) el.removeChild(el.lastChild);
}

function haversine(lat1, lng1, lat2, lng2) {
  var R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function degToCompass(d) {
  return ['北','北東','東','南東','南','南西','西','北西'][Math.round(d/45)%8];
}

// ── セッション永続化 ──────────────────────────────
function saveSession() {
  var r = document.getElementById('bus-route-sel').value;
  var name = document.getElementById('bus-name').value;
  var data = {
    operating: operating,
    route: r,
    busName: name,
    startTime: startTime,
    passedStops: passedStops,
    notifiedStops: Array.from(notifiedStops)
  };
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

function restoreSession() {
  var raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return false;
  try {
    var data = JSON.parse(raw);
    if (!data.operating) return false;
    passedStops = data.passedStops || [];
    notifiedStops = new Set(data.notifiedStops || []);
    startTime = data.startTime || Date.now();
    operating = true;
    document.getElementById('bus-name').value = data.busName || document.getElementById('bus-name').value;
    document.getElementById('bus-route-sel').value = data.route || '2';
    onRouteChange();
    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;
    document.getElementById('bus-name').disabled = true;
    document.getElementById('bus-route-sel').disabled = true;
    var r = data.route || '2';
    document.getElementById('header-sub').textContent = data.busName + '　' + (routeNames[r] || 'ルート' + r) + '　運行中（復帰）';
    setStatusBar(true);
    setGpsState('acquiring', '位置情報を再取得中…', 'アプリが再起動されました');
    watchId = navigator.geolocation.watchPosition(onPosition, onGpsError,
      {enableHighAccuracy: true, maximumAge: 1000, timeout: 15000});
    var interval = parseInt(document.getElementById('interval').value);
    sendInterval = setInterval(doSend, interval);
    elapsedInterval = setInterval(updateElapsed, 1000);
    renderStopChecklist();
    addLog('⚡ 運行中のセッションを復元しました', 'ok');
    return true;
  } catch(e) {
    clearSession();
    return false;
  }
}

// 初期化
setTimeout(function() {
  miniMap = L.map('mini-map', {center:[35.1815,136.9066], zoom:13, zoomControl:false, attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(miniMap);
  updateRouteSelect();
  onRouteChange();
  // 運行中のセッションがあれば復元
  restoreSession();
}, 200);
</script>
