<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Catch the Bus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

:root {
  --bg: #f0f7ff;
  --surface: #ffffff;
  --surface2: #eef6ff;
  --accent: #4a90d9;
  --green: #34d399;
  --green-dim: #0d2e1e;
  --amber: #fbbf24;
  --text: #1e3a5f;
  --text-muted: #6b8cae;
  --border: rgba(74,144,217,0.15);
  --radius: 20px;
  --shadow: 0 4px 24px rgba(74,144,217,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Zen Maru Gothic', 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(74,144,217,0.07) 0%, transparent 50%),
    radial-gradient(circle at 85% 85%, rgba(52,211,153,0.06) 0%, transparent 50%);
}

/* ── ログイン画面 ── */
#login-screen {
  position: fixed; inset: 0;
  background: linear-gradient(160deg, #e8f4fd 0%, #f0fff8 60%, #e3f2fd 100%);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; flex-direction: column;
  padding: 20px;
}
#login-screen.hidden { display: none; }

.login-card {
  background: #fff;
  border-radius: 28px;
  padding: 36px 28px;
  width: min(360px, 100%);
  text-align: center;
  box-shadow: 0 12px 48px rgba(74,144,217,0.16);
  border: 1.5px solid rgba(74,144,217,0.1);
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }

.login-logo { font-size:48px; margin-bottom:8px; }
.login-brand { font-size:22px; font-weight:900; color:var(--accent); letter-spacing:-.5px; margin-bottom:4px; }
.login-sub { font-size:14px; color:var(--text-muted); margin-bottom:28px; }

.login-field {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid var(--border);
  border-radius: 14px; font-size: 15px;
  font-family: inherit; background: var(--surface2);
  color: var(--text); outline: none;
  transition: border .2s; margin-bottom: 10px;
}
.login-field:focus { border-color: var(--accent); }
.login-field[type=password] { letter-spacing: 4px; }

.login-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--accent), #2176c7);
  color: #fff; border: none; border-radius: 14px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all .15s;
  box-shadow: 0 4px 16px rgba(74,144,217,.3);
  margin-top: 4px;
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(74,144,217,.4); }
.login-error { color: #f87171; font-size: 14px; margin-top: 8px; min-height: 18px; }

/* ── メイン画面 ── */
#main-screen { display: none; min-height: 100dvh; }
#main-screen.visible { display: block; }

/* ヘッダー */
.top-header {
  background: linear-gradient(135deg, var(--accent), #2176c7);
  padding: 16px 20px 14px;
  color: #fff;
  position: sticky; top: 0; z-index: 100;
}
.top-brand { font-size: 14px; font-weight: 700; opacity: .8; letter-spacing: .05em; margin-bottom: 2px; }
.top-title { font-size: 18px; font-weight: 900; letter-spacing: -.3px; }
.top-row { display: flex; align-items: center; justify-content: space-between; }
.top-num {
  background: rgba(255,255,255,.2); border-radius: 20px;
  padding: 4px 14px; font-size: 13px; font-weight: 700;
}
.logout-btn {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; border-radius: 10px; padding: 5px 12px;
  font-size: 13px; cursor: pointer; font-family: inherit;
}

.container { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

/* 運行状況バナー */
.operation-banner {
  border-radius: 16px; padding: 14px 18px;
  margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  font-size: 14px; font-weight: 700;
  border: 1.5px solid;
}
.operation-banner.normal { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.3); color: #059669; }
.operation-banner.half { background: rgba(251,191,36,.1); border-color: rgba(251,191,36,.3); color: #d97706; }
.operation-banner.cancel { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); color: #dc2626; }
.operation-banner.unknown { background: rgba(107,140,174,.1); border-color: rgba(107,140,174,.2); color: var(--text-muted); }
.op-icon { font-size: 22px; flex-shrink: 0; }
.op-text { flex: 1; }
.op-label { font-size: 13px; opacity: .7; margin-bottom: 1px; }
.op-status { font-size: 16px; font-weight: 800; }

/* バス状況カード */
.bus-card {
  background: #fff; border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
}
.bus-card-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.bus-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.bus-icon.blue { background: rgba(74,144,217,.12); }
.bus-icon.yellow { background: rgba(251,191,36,.15); }
.bus-card-name { font-size: 15px; font-weight: 700; }
.bus-card-stop { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

/* メッセージエリア */
.msg-area {
  border-radius: 14px; padding: 16px;
  text-align: center; margin-bottom: 12px;
}
.msg-area.waiting {
  background: var(--surface2);
  border: 1.5px dashed var(--border);
}
.msg-area.approaching {
  background: rgba(251,191,36,.1);
  border: 1.5px solid rgba(251,191,36,.3);
  animation: pulse-border 1.5s infinite;
}
.msg-area.passed {
  background: rgba(52,211,153,.08);
  border: 1.5px solid rgba(52,211,153,.25);
}
.msg-area.arrived {
  background: rgba(52,211,153,.12);
  border: 2px solid rgba(52,211,153,.4);
}
@keyframes pulse-border {
  0%,100%{ box-shadow: 0 0 0 0 rgba(251,191,36,.3); }
  50%{ box-shadow: 0 0 0 6px rgba(251,191,36,.0); }
}

.msg-icon { font-size: 36px; margin-bottom: 8px; }
.msg-main { font-size: 17px; font-weight: 700; line-height: 1.5; }
.msg-sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
.msg-time { font-size: 24px; font-weight: 800; color: var(--accent); margin-top: 6px; }

/* 前のバス停 */
.prev-stop {
  font-size: 14px; color: var(--text-muted);
  text-align: center; padding: 8px;
  border-radius: 10px; background: var(--surface2);
}

/* 待機中 */
.not-operating {
  text-align: center; padding: 32px 20px;
  color: var(--text-muted); font-size: 14px;
}
.not-operating .big-icon { font-size: 48px; margin-bottom: 12px; }

/* トースト */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1e3a5f; color: #fff;
  padding: 12px 24px; border-radius: 20px;
  font-size: 14px; font-weight: 600;
  z-index: 9999; transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  white-space: nowrap; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🚌</div>
    <div class="login-brand">Catch the Bus</div>
    <div class="login-sub">保護者向けバス情報</div>
    <input class="login-field" type="number" id="login-num" placeholder="園児番号" min="1" max="9999">
    <input class="login-field" type="password" id="login-pw" placeholder="パスワード">
    <button class="login-btn" id="login-btn">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <div class="top-header">
    <div class="top-brand">🚌 Catch the Bus</div>
    <div class="top-row">
      <div class="top-title">バス運行情報</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="top-num" id="display-num"></div>
        <button class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </div>
  <div class="container">

    <!-- 運行状況バナー -->
    <div class="operation-banner unknown" id="op-banner">
      <div class="op-icon">🚌</div>
      <div class="op-text">
        <div class="op-label">本日のバスの運行</div>
        <div class="op-status" id="op-status">情報を読み込み中…</div>
      </div>
    </div>

    <!-- バス情報 -->
    <div id="bus-info-area"></div>

  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ══════════════════════════════
//  Firebase設定（bus_monitor_fixed.htmlと同じ）
// ══════════════════════════════
firebase.initializeApp({
  apiKey: "AIzaSyBxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
  authDomain: "catch-the-bus-7de42.firebaseapp.com",
  databaseURL: "https://catch-the-bus-7de42-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "catch-the-bus-7de42",
  storageBucket: "catch-the-bus-7de42.firebasestorage.app",
  messagingSenderId: "xxxxxxxxxxxx",
  appId: "xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
});
const db = firebase.database();

// ══════════════════════════════
//  ユーザーデータ（Firebaseから管理）
// ══════════════════════════════
// config/parents/{num} = { pw, busColor, stopIndex, routeId }
// config/operation = { status: 'normal'|'half'|'cancel', message: '' }

let currentUser = null; // { num, busColor, stopIndex, routeId }
let stops = { '1': [], '2': [] };
let latestPassRecords = {}; // busId -> 最新の通過記録
let operationStatus = 'unknown';
let unsubscribes = [];

// ══════════════════════════════
//  ログイン
// ══════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('ctb_parent');
  if (saved) { currentUser = JSON.parse(saved); startListening(); showMain(); }

  document.getElementById('login-pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('login-btn').addEventListener('click', doLogin);
});

function doLogin() {
  const num = document.getElementById('login-num').value.trim();
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-error');
  if (!num) { err.textContent = '園児番号を入力してください'; return; }

  // Firebaseから保護者情報を取得
  db.ref('config/parents/' + num).once('value').then(snap => {
    const data = snap.val();
    if (!data || data.pw !== pw) {
      err.textContent = '番号またはパスワードが違います';
      return;
    }
    currentUser = { num, busColor: data.busColor, stopIndex: data.stopIndex, routeId: data.routeId };
    sessionStorage.setItem('ctb_parent', JSON.stringify(currentUser));
    startListening();
    showMain();
  }).catch(() => {
    err.textContent = 'エラーが発生しました。再度お試しください';
  });
}

function showMain() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.add('visible');
  document.getElementById('display-num').textContent = 'No.' + String(currentUser.num).padStart(3,'0');
}

function logout() {
  sessionStorage.removeItem('ctb_parent');
  unsubscribes.forEach(fn => fn());
  location.reload();
}

// ══════════════════════════════
//  Firebase監視
// ══════════════════════════════
function startListening() {
  // バス停データ
  const stopsRef = db.ref('config/stops');
  const stopsHandler = stopsRef.on('value', snap => {
    const data = snap.val();
    if (data) {
      function toArr(obj) {
        if (!obj) return [];
        if (Array.isArray(obj)) return obj;
        return Object.keys(obj).sort((a,b)=>Number(a)-Number(b)).map(k=>obj[k]);
      }
      stops['1'] = toArr(data['1']);
      stops['2'] = toArr(data['2']);
    }
    renderBusInfo();
  });
  unsubscribes.push(() => stopsRef.off('value', stopsHandler));

  // 運行状況
  const opRef = db.ref('config/operation');
  const opHandler = opRef.on('value', snap => {
    const data = snap.val();
    operationStatus = data ? data.status : 'unknown';
    renderOperationBanner(data);
  });
  unsubscribes.push(() => opRef.off('value', opHandler));

  // 通過記録
  const passRef = db.ref('pass_records');
  const passHandler = passRef.on('value', snap => {
    const data = snap.val() || {};
    latestPassRecords = {};
    Object.keys(data).forEach(busId => {
      const records = Object.values(data[busId]);
      records.sort((a,b) => b.timestamp - a.timestamp);
      latestPassRecords[busId] = records;
    });
    renderBusInfo();
  });
  unsubscribes.push(() => passRef.off('value', passHandler));

  // バス運行状態監視（運行終了で待機画面に戻す）
  const busesRef = db.ref('buses');
  const busesHandler = busesRef.on('value', snap => {
    const data = snap.val() || {};
    const { busColor } = currentUser;
    const targetBusName = busColor === 'blue' ? '青バス' : '黄バス';
    const isRunning = Object.values(data).some(b => b.busName === targetBusName);
    if (!isRunning) {
      // 運行中でなければ pass_records もクリアして待機画面へ
      latestPassRecords = {};
      lastSoundState = '';
      renderBusInfo();
    }
  });
  unsubscribes.push(() => busesRef.off('value', busesHandler));
}

// ══════════════════════════════
//  運行状況バナー
// ══════════════════════════════
function renderOperationBanner(data) {
  const banner = document.getElementById('op-banner');
  const statusEl = document.getElementById('op-status');
  const status = data ? data.status : 'unknown';

  const map = {
    normal:  { cls:'normal',  icon:'✅', label:'通常運行' },
    half:    { cls:'half',    icon:'⚠️', label:'半日運行' },
    cancel:  { cls:'cancel',  icon:'❌', label:'運休' },
    unknown: { cls:'unknown', icon:'🚌', label:'情報なし' },
  };
  const info = map[status] || map.unknown;
  banner.className = 'operation-banner ' + info.cls;
  banner.querySelector('.op-icon').textContent = info.icon;
  statusEl.textContent = info.label + (data && data.message ? '　' + data.message : '');
}

// ══════════════════════════════
//  バス情報レンダリング
// ══════════════════════════════
function renderBusInfo() {
  const area = document.getElementById('bus-info-area');
  const { busColor, stopIndex, routeId } = currentUser;

  // 自分のバス停
  const myStops = stops[routeId] || [];
  const myStop = myStops[stopIndex];
  const myStopName = myStop ? myStop.name : '（未設定）';

  // バスIDを特定（青=blue,黄=yellow）
  const targetBusName = busColor === 'blue' ? '青バス' : '黄バス';
  const busIcon = busColor === 'blue' ? '🔵' : '🟡';
  const busIconClass = busColor === 'blue' ? 'blue' : 'yellow';

  // そのバスの通過記録を取得
  let records = [];
  Object.values(latestPassRecords).forEach(recs => {
    if (recs.length && recs[0].busName === targetBusName) {
      records = recs;
    }
  });

  // 運行中かチェック
  const hasDepart = records.some(r => r.isDepart);
  const hasArrive = records.some(r => r.isArrive);

  // 自分のバス停の直前バス停（stopIndex-1）が通過済みか
  const prevStopIndex = stopIndex - 1;
  const prevStop = prevStopIndex >= 0 ? myStops[prevStopIndex] : null;
  const prevStopName = prevStop ? prevStop.name : null;

  // 自分のバス停が通過済みか
  const myStopPassed = records.some(r => r.stopName === myStopName && !r.isDepart && !r.isArrive);
  const prevStopPassed = prevStopName ? records.some(r => r.stopName === prevStopName && !r.isDepart && !r.isArrive) : false;

  // 到着済みか（最後のバス停）
  const isLastStop = stopIndex === myStops.length - 1;

  let msgHTML = '';

  if (!hasDepart) {
    // 運行前
    msgHTML = `
      <div class="msg-area waiting">
        <div class="msg-icon">🕐</div>
        <div class="msg-main">バスの運行開始をお待ちください</div>
        <div class="msg-sub">運行が始まるとお知らせします</div>
      </div>`;
  } else if (hasArrive && isLastStop && myStopPassed) {
    // 自分が最後のバス停で到着
    msgHTML = `
      <div class="msg-area arrived">
        <div class="msg-icon">🏁</div>
        <div class="msg-main">目的地に到着しました</div>
        <div class="msg-sub">${(records.find(r=>r.isArrive)?.time || '').slice(0,5)}</div>
      </div>`;
    playSound();
  } else if (myStopPassed) {
    // 自分のバス停通過済み
    const passedRec = records.find(r => r.stopName === myStopName);
    msgHTML = `
      <div class="msg-area passed">
        <div class="msg-icon">✅</div>
        <div class="msg-main">${myStopName} を通過しました</div>
        <div class="msg-time">${passedRec ? passedRec.time.slice(0,5) : ''}</div>
      </div>`;
  } else if (prevStopPassed || (stopIndex === 0 && hasDepart)) {
    // 直前のバス停を通過 → 接近中
    const prevRec = stopIndex === 0
      ? records.find(r => r.isDepart)
      : records.find(r => r.stopName === prevStopName);
    msgHTML = `
      <div class="msg-area approaching">
        <div class="msg-icon">🚌</div>
        <div class="msg-main">バスがまもなく到着します！</div>
        <div class="msg-sub">${prevStopName ? prevStopName + ' を出発しました' : '運行を開始しました'}</div>
        <div class="msg-time">${prevRec ? prevRec.time.slice(0,5) : ''}</div>
      </div>`;
    playSound();
  } else {
    // 運行中・まだ遠い
    // 最後に通過したバス停を表示
    const lastPassedName = (() => {
      const normalRecs = records.filter(r => !r.isDepart && !r.isArrive);
      return normalRecs.length ? normalRecs[0].stopName : null;
    })();
    msgHTML = `
      <div class="msg-area waiting">
        <div class="msg-icon">🚌</div>
        <div class="msg-main">バスは運行中です</div>
        <div class="msg-sub">${myStopName} への到着をお待ちください</div>
      </div>
      ${lastPassedName ? `<div class="prev-stop">🚏 現在 <strong>${lastPassedName}</strong> を通過しました</div>` : ''}`;
  }

  area.innerHTML = `
    <div class="bus-card">
      <div class="bus-card-header">
        <div class="bus-icon ${busIconClass}">${busIcon}</div>
        <div>
          <div class="bus-card-name">${targetBusName}</div>
          <div class="bus-card-stop">🚏 あなたのバス停：${myStopName}</div>
        </div>
      </div>
      ${msgHTML}
    </div>`;
}

// ══════════════════════════════
//  通知音
// ══════════════════════════════
let lastSoundState = '';
function playSound() {
  // 状態変化時のみ鳴らす
  const area = document.querySelector('.msg-area');
  const state = area ? area.className : '';
  if (state === lastSoundState) return;
  lastSoundState = state;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
      gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.15 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
